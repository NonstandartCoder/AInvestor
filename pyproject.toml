[project]
name = "AInvestor"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "pandas-ta>=0.3.14b1",
    "ta>=0.11",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
eda = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "yfinance>=0.2.40",         # fallback-источник MOEX
    "sweetviz>=2.3",            # авто-EDA отчёт
    "ydata-profiling>=4.6",     # альтернатива sweetviz
]

web = [
    "streamlit>=1.36",
    "streamlit-autorefresh>=1.0",
    "altair>=5.3",
]

dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py312"

line-length = 100

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

ignore = []

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
